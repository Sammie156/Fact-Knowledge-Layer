services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fact-knowledge-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=factdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=factstuff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fact-knowledge-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:factstuff@db:5432/factdb
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded PDFs across container restarts
      - ./uploads:/app/backend/uploads
      # Optional folder for manual CLI PDF testing
      - ./pdfs:/app/pdfs

volumes:
  pgdata:
