services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=factdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=factstuff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:factstuff@db:5432/factdb
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Mount a local pdfs/ folder so you can pass PDFs to the container
      - ./pdfs:/app/pdfs
    # Keep the container running so you can exec into it
    command: tail -f /dev/null

volumes:
  pgdata:
